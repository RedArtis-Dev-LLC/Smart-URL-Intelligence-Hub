server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/auth_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

auth:
  jwt:
    private-key-path: ${AUTH_JWT_PRIVATE_KEY_PATH:file:/run/secrets/auth-jwt/private.pem}
    public-key-path: ${AUTH_JWT_PUBLIC_KEY_PATH:file:/run/secrets/auth-jwt/public.pem}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: smart-url-hub-auth
