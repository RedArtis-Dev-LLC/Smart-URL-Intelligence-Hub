name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs ONLY for PRs. Pushes to main must complete so the
# branch-protection required checks aren't cancelled by a follow-up commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: temurin
  MAVEN_CLI_OPTS: -B -ntp

jobs:
  # ------------------------------------------------------------------
  # 1. Build (compile + install, no tests). Fast-fails on compile errors
  # and primes the Maven cache for downstream matrix legs.
  # ------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile + install (skip tests)
        run: ./mvnw $MAVEN_CLI_OPTS install -DskipTests

  # ------------------------------------------------------------------
  # 2. Tests, one matrix leg per module → parallel across runners.
  # `-am` rebuilds upstream module deps; third-party deps come from cache.
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - common-lib
          - config-server
          - auth-service
          - api-gateway
          - link-service
          - analytics-service
          - webhook-service
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit + integration tests
        timeout-minutes: 25
        env:
          MODULE: ${{ matrix.module }}
        run: ./mvnw $MAVEN_CLI_OPTS -pl "$MODULE" -am verify

      - name: Upload module output (coverage + classes + reports)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-output-${{ matrix.module }}
          # Sonar needs compiled classes AND jacoco XMLs to compute coverage.
          # `pom.xml` (parent, at workspace root) is included as an LCA anchor:
          # upload-artifact@v4+ strips the least-common-ancestor of all paths,
          # so without something at workspace root the `<module>/target/` prefix
          # would be stripped and the jacoco XMLs would land at the workspace
          # root on download (instead of `<module>/target/site/jacoco/...`),
          # breaking sonar's `**/target/site/jacoco/jacoco.xml` glob.
          path: |
            pom.xml
            ${{ matrix.module }}/target/classes/**
            ${{ matrix.module }}/target/test-classes/**
            ${{ matrix.module }}/target/jacoco.exec
            ${{ matrix.module }}/target/jacoco-it.exec
            ${{ matrix.module }}/target/site/jacoco/**
            ${{ matrix.module }}/target/site/jacoco-it/**
            ${{ matrix.module }}/target/surefire-reports/**
            ${{ matrix.module }}/target/failsafe-reports/**
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 3. Aggregate matrix into a single required status check. Without this,
  # branch protection would need every matrix leg listed by name —
  # brittle when modules are added/renamed.
  # ------------------------------------------------------------------
  tests-passed:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      contents: read
    steps:
      - name: Fail if any matrix leg failed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::test matrix did not pass (result: $TEST_RESULT)"
            exit 1
          fi

  # ------------------------------------------------------------------
  # 4. SonarCloud — ONE aggregated scan covering the whole monorepo.
  # Skipped if SONAR_ORGANIZATION repo variable is unset.
  # ------------------------------------------------------------------
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: tests-passed
    if: ${{ vars.SONAR_ORGANIZATION != '' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # SonarCloud needs full git history for new-code period & blame.
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache SonarCloud scanner files
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Restore all module outputs (classes + coverage from test matrix)
        uses: actions/download-artifact@v8
        with:
          pattern: module-output-*
          merge-multiple: true

      - name: Run SonarCloud scan (aggregated, parent reactor)
        # PR-author-controllable values (head_ref, base_ref, etc.) MUST pass
        # through `env:` and be referenced as shell vars, never interpolated
        # directly into the `run:` script — otherwise a malicious branch name
        # could inject arbitrary commands (CWE-94).
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # PR mode: SonarCloud analyzes only the diff against base and
          # reports against the persistent main baseline ("new code" view).
          # On push to main, we omit these so the full branch is analyzed
          # and becomes the new baseline.
          PR_ARGS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_ARGS=(
              "-Dsonar.pullrequest.key=$PR_NUMBER"
              "-Dsonar.pullrequest.branch=$PR_HEAD_REF"
              "-Dsonar.pullrequest.base=$PR_BASE_REF"
            )
          fi

          # Single scan at parent level: Maven walks the full reactor, Sonar
          # sees every module's sources + jacoco XMLs (matched by glob in the
          # parent POM), and uploads everything as one project.
          # `install -DskipTests` ensures internal module jars are in ~/.m2
          # so the reactor resolves cleanly; `-Djacoco.skip=true` prevents
          # JaCoCo from overwriting the XML reports restored from artifacts
          # (important for modules that have only ITs and no unit tests, where
          # jacoco.exec is empty and `jacoco:report` would produce 0% coverage).
          ./mvnw $MAVEN_CLI_OPTS install sonar:sonar -DskipTests -Djacoco.skip=true \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            "${PR_ARGS[@]}"
