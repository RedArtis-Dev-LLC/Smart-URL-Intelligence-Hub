name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs ONLY for PRs. Pushes to main must complete so the
# branch-protection required checks aren't cancelled by a follow-up commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token: pure-read for everything. SonarCloud's GitHub App
# handles PR decoration server-side, so we don't need pull-requests: write.
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: temurin
  MAVEN_CLI_OPTS: -B -ntp

jobs:
  # ------------------------------------------------------------------
  # 1. Build (compile + install, no tests). Fast-fails on compile errors
  # and primes the Maven cache for downstream matrix legs.
  # ------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile + install (skip tests)
        run: ./mvnw $MAVEN_CLI_OPTS install -DskipTests

  # ------------------------------------------------------------------
  # 2. Format check (Spotless). Runs in parallel with build — independent.
  # ------------------------------------------------------------------
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Spotless check
        run: ./mvnw $MAVEN_CLI_OPTS spotless:check

  # ------------------------------------------------------------------
  # 3. Tests, one matrix leg per module → parallel across runners.
  # `-am` rebuilds upstream module deps; third-party deps come from cache.
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - common-lib
          - config-server
          - auth-service
          - api-gateway
          - link-service
          - analytics-service
          - webhook-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit + integration tests
        timeout-minutes: 25
        run: ./mvnw $MAVEN_CLI_OPTS -pl ${{ matrix.module }} -am verify

      - name: Upload module output (coverage + classes + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-output-${{ matrix.module }}
          # Sonar needs compiled classes AND jacoco XMLs to compute coverage.
          path: |
            ${{ matrix.module }}/target/classes/**
            ${{ matrix.module }}/target/test-classes/**
            ${{ matrix.module }}/target/jacoco.exec
            ${{ matrix.module }}/target/jacoco-it.exec
            ${{ matrix.module }}/target/site/jacoco/**
            ${{ matrix.module }}/target/site/jacoco-it/**
            ${{ matrix.module }}/target/surefire-reports/**
            ${{ matrix.module }}/target/failsafe-reports/**
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 4. Aggregate matrix into a single required status check. Without this,
  # branch protection would need every matrix leg listed by name —
  # brittle when modules are added/renamed.
  # ------------------------------------------------------------------
  tests-passed:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Fail if any matrix leg failed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::test matrix did not pass (result: ${{ needs.test.result }})"
            exit 1
          fi

  # ------------------------------------------------------------------
  # 5. SonarCloud — ONE aggregated scan covering the whole monorepo.
  # Skipped if SONAR_ORGANIZATION repo variable is unset.
  # ------------------------------------------------------------------
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: tests-passed
    if: ${{ vars.SONAR_ORGANIZATION != '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud needs full git history for new-code period & blame.
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache SonarCloud scanner files
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Restore all module outputs (classes + coverage from test matrix)
        uses: actions/download-artifact@v4
        with:
          pattern: module-output-*
          merge-multiple: true

      - name: Run SonarCloud scan (aggregated, parent reactor)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          # PR mode: SonarCloud analyzes only the diff against base and
          # reports against the persistent main baseline ("new code" view).
          # On push to main, we omit these so the full branch is analyzed
          # and becomes the new baseline.
          PR_ARGS=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_ARGS=(
              "-Dsonar.pullrequest.key=${{ github.event.pull_request.number }}"
              "-Dsonar.pullrequest.branch=${{ github.head_ref }}"
              "-Dsonar.pullrequest.base=${{ github.base_ref }}"
            )
          fi

          # Single scan at parent level: Maven walks the full reactor, Sonar
          # sees every module's sources + jacoco XMLs (matched by glob in the
          # parent POM), and uploads everything as one project.
          # `install -DskipTests` ensures internal module jars are in ~/.m2
          # so the reactor resolves cleanly; jacoco files restored from
          # artifacts are untouched (no `clean`, no test re-run).
          ./mvnw $MAVEN_CLI_OPTS install sonar:sonar -DskipTests \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true \
            "${PR_ARGS[@]}"
