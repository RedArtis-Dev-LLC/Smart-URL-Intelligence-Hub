databaseChangeLog:
  - changeSet:
      id: 001-create-webhook-configs
      author: smart-url-hub
      changes:
        - createTable:
            tableName: webhook_configs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: link_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: target_url
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: threshold
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: webhook_configs
            columnNames: link_id, threshold
            constraintName: uq_webhook_configs_link_threshold
        - createIndex:
            tableName: webhook_configs
            indexName: idx_webhook_configs_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: webhook_configs
            indexName: idx_webhook_configs_link_id
            columns:
              - column:
                  name: link_id
