spring:
  application:
    name: link-service
  cloud:
    config:
      enabled: false
  config:
    import: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      export:
        enabled: false

link:
  short-code:
    length: 7
    max-generation-retries: 5
  redirect:
    max-optimistic-lock-retries: 3
  outbox:
    poll-interval-ms: 500
    batch-size: 50
    cleanup-cron: "0 0 3 * * *"
    retention-period: 7d
  amqp:
    click-events-exchange: click.events
    click-events-routing-key: click.event
